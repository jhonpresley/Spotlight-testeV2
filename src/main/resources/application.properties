spring.application.name=recognition-platform

# MySQL. The database decision is settled: a shared server the whole team
# points at, rather than an H2 file that only ever existed on one laptop and
# had to be deleted to be reset.
#
# createDatabaseIfNotExist means a fresh clone does not need anyone to run
# CREATE DATABASE by hand - Liquibase then builds the tables inside it.
#
# Credentials come from the environment (or the gitignored .env), exactly like
# groq.api.key below. The committed defaults are deliberately useless, so a
# real password can never arrive here by accident - this repository is public.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/recognitiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:141512}

# Liquibase now owns schema creation - Hibernate only validates that the
# entity mappings match what Liquibase built, it never creates/alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Loads changeset 005, the demo nominations. On by default so anyone who clones
# this and runs it gets a populated dashboard rather than an empty one that looks
# broken. Delete this line for a schema-only database (i.e. before a real deploy).
spring.liquibase.contexts=demo

# Dev-only endpoints under /api/dev: POST /reset puts the database back to the
# thirteen seeded nominations, GET /status reports what is in it. On here
# because both the Playwright suite (which resets before every test, so any
# spec can be re-run) and the front end's demo panel depend on them.
#
# Delete this line before a real deploy. There is no authentication in this
# application, so an exposed reset is an unauthenticated wipe of every
# nomination; without the property the endpoints do not exist at all.
app.dev-tools.enabled=true

# The H2 console is gone with H2. Browse the data with MySQL Workbench, which
# is already installed - connect to localhost:3306, schema `recognitiondb`.

# Epic 2 - AI tagging.
#   auto (default) - use Groq if GROQ_API_KEY is set, otherwise fall back to the
#                    built-in mock evaluator. A fresh clone works with no setup.
#   groq           - always Groq; without a key, evaluations report as skipped
#   mock           - always the mock, even when a key is available
ai.evaluator=auto

# Read from the GROQ_API_KEY environment variable, never hardcoded - this file
# is committed to a public repository, and a key pasted here is public the
# moment it is pushed and stays in the history afterwards.
#   PowerShell:  $env:GROQ_API_KEY = "gsk_..."
#   bash:        export GROQ_API_KEY=gsk_...
# The trailing colon makes it default to empty rather than failing startup: with
# no key the evaluator reports itself unavailable and nominations still submit,
# carrying rule flags and an "AI review unavailable" status.
# Looks in three places, in order: a real environment variable, then the
# gitignored .env file, then falls back to empty. The env var wins so CI and
# deployed environments can override the file without editing it, and the empty
# default means a missing key downgrades to the mock evaluator rather than
# failing startup.
groq.api.key=${GROQ_API_KEY:${env.GROQ_API_KEY:}}
groq.api.model=openai/gpt-oss-20b

# Read the prompt straight from the source file rather than the packaged copy,
# so editing it takes effect on the very next submission - no rebuild, no
# restart. The file is re-read for each evaluation; it is a few KB and the call
# it precedes is a network request, so the read costs nothing worth measuring.
#
# The path is relative to wherever the app was started, which is the project
# root under `mvn spring-boot:run`. If it is not readable the packaged prompt on
# the classpath is used instead and a warning is logged, so a real deployment
# (where src/ does not exist) still works untouched.
ai.prompt.file=src/main/resources/prompts/nomination-evaluation-v1.txt

server.port=8080

# index.html must never be cached: it is the only file that knows the current
# bundle's name, so a stale copy points at a bundle that no longer exists.
# The bundles themselves are content-hashed by the Vite build, which means a
# changed file is a changed URL and there is nothing to invalidate - the whole
# reason the previous hand-edited ?v= token existed, and the reason a rebuilt
# UI used to keep showing the old version until someone hard-refreshed.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
