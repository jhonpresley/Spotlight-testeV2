# Test profile for @SpringBootTest integration tests (@ActiveProfiles("test")).
#
# Points at a separate schema (recognitiondb_test) from the dev/demo database, so
# integration tests never touch real dev data. createDatabaseIfNotExist=true means
# no manual `CREATE DATABASE` step - the same mechanism the main
# application.properties already relies on for a fresh clone.
spring.datasource.url=jdbc:mysql://localhost:3306/recognitiondb_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:141512}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Explicitly excludes the demo context. Simply omitting this property does NOT
# skip context="demo" changesets - verified empirically: Spring Boot's
# Liquibase auto-config runs every changeset (context-tagged or not) when no
# contexts property is set at all, contrary to what db.changelog-master.xml's
# comment implies. The "!" exclusion syntax is the actual way to get a clean,
# empty-tables schema for integration tests.
spring.liquibase.contexts=!demo

# Never call the real Groq API from a test, even if a key happens to be in the
# environment - deterministic, offline, no network flakiness.
ai.evaluator=mock
groq.api.key=
